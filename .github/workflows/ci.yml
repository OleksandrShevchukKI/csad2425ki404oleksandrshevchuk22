name: CI Pipeline

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  dotnet-build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4 
      with:
        dotnet-version: '8.0'

    # Install the required MAUI workloads
    - name: Install MAUI Workloads
      run: |
        dotnet workload install maui-android
        dotnet add package Microsoft.NETCore.App.Runtime.win-x64 --version 8.0.0

    # List the contents of the directory for debugging
    - name: List files for debugging
      run: |
        echo "Current directory:"
        pwd
        echo "Directory contents:"
        ls -R

    # Restore dependencies for the RockPaperScissorsClient
    - name: Restore Dependencies for RockPaperScissorsClient
      run: dotnet restore
      working-directory: RockPaperScissors/RockPaperScissorsClient/RockPaperScissorsClient

    # Build the RockPaperScissorsClient project
    - name: Build RockPaperScissorsClient Project
      run: dotnet build --configuration Release --no-restore --runtime win-x64
      working-directory: RockPaperScissors/RockPaperScissorsClient/RockPaperScissorsClient

    # Publish the RockPaperScissorsClient project
    - name: Publish RockPaperScissorsClient Project
      run: dotnet publish --configuration Release --no-restore --runtime win-x64 -o ./publish
      working-directory: RockPaperScissors/RockPaperScissorsClient/RockPaperScissorsClient

    # Upload the build artifacts
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4  
      with:
        name: published-artifacts
        path: ./publish

  # Job for compiling the Arduino project (if applicable)
  arduino-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Arduino CLI
      uses: arduino/setup-arduino-cli@v1
      with:
        version: '0.19.2'

    - name: Install Arduino AVR platform
      run: arduino-cli core install arduino:avr

    - name: Build Arduino Project
      run: arduino-cli compile --fqbn arduino:avr:uno RockPaperScissors/RockPaperScissorsServer/RockPaperScissorsServer.ino

    - name: Upload Arduino Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: arduino-build
        path: RockPaperScissors/RockPaperScissorsServer/build/*
