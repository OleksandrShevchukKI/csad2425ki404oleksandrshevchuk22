name: CI Pipeline

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  dotnet-build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4 
      with:
        dotnet-version: '8.0'

    # Install the required MAUI workloads
    - name: Install .NET MAUI
      run: dotnet workload install maui

    # Restore dependencies for the RockPaperScissorsClient
    - name: Restore Dependencies
      run: dotnet restore
      working-directory: RockPaperScissors/RockPaperScissorsClient

    # Restore dependencies for Windows
    - name: Restore Dependencies for Windows
      run: dotnet restore RockPaperScissorsClient/RockPaperScissorsClient.csproj --runtime win-x64
      working-directory: RockPaperScissors/RockPaperScissorsClient

    # Build the project for Windows
    - name: Build for Windows
      run: dotnet build RockPaperScissorsClient/RockPaperScissorsClient.csproj -c Release -f net8.0-windows10.0.19041.0 --no-restore
      working-directory: RockPaperScissors/RockPaperScissorsClient

  # Job for compiling the Arduino project (if applicable)
  arduino-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Arduino CLI
      uses: arduino/setup-arduino-cli@v1
      with:
        version: '0.19.2'

    - name: Install Arduino AVR platform
      run: arduino-cli core install arduino:avr

    - name: Build Arduino Project
      run: arduino-cli compile --fqbn arduino:avr:uno RockPaperScissors/RockPaperScissorsServer/RockPaperScissorsServer.ino

    - name: Upload Arduino Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: arduino-build
        path: RockPaperScissors/RockPaperScissorsServer/build/*
