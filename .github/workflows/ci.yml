name: CI Pipeline

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  dotnet-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4 
      with:
        dotnet-version: '8.0'

    # Install the required MAUI workloads for Android
    - name: Install MAUI Workloads for Android
      run: dotnet workload install maui-android

    # List the contents of the directory for debugging
    - name: List files for debugging
      run: |
        echo "Current directory:"
        pwd
        echo "Directory contents:"
        ls -R

    # Restore dependencies for the RockPaperScissors 
    - name: Restore Dependencies for RockPaperScissorsClient
      run: dotnet restore
      working-directory: RockPaperScissors/RockPaperScissorsClient/RockPaperScissorsClient

    # Build the RockPaperScissorsClient project
    - name: Build RockPaperScissorsClient Project
      run: dotnet build --configuration Release --no-restore
      working-directory: RockPaperScissors/RockPaperScissorsClient/RockPaperScissorsClient

    # Publish the RockPaperScissorsClient project
    - name: Publish RockPaperScissorsClient Project
      run: dotnet publish --configuration Release --no-restore -o ./publish
      working-directory: RockPaperScissors/RockPaperScissorsClient/RockPaperScissorsClient

    # Upload the build artifacts
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4  
      with:
        name: published-artifacts
        path: ./publish

  dotnet-build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4 
      with:
        dotnet-version: '8.0'

    # Install the required MAUI workloads for iOS and MacCatalyst
    - name: Install MAUI Workloads for iOS and MacCatalyst
      run: |
        dotnet workload install maui-ios
        dotnet workload install maui-maccatalyst

    # List the contents of the directory for debugging
    - name: List files for debugging
      run: |
        echo "Current directory:"
        pwd
        echo "Directory contents:"
        ls -R

    # Restore dependencies for the RockPaperScissors 
    - name: Restore Dependencies for RockPaperScissorsClient
      run: dotnet restore
      working-directory: RockPaperScissors/RockPaperScissorsClient/RockPaperScissorsClient

    # Build the RockPaperScissorsClient project
    - name: Build RockPaperScissorsClient Project
      run: dotnet build --configuration Release --no-restore
      working-directory: RockPaperScissors/RockPaperScissorsClient/RockPaperScissorsClient

    # Publish the RockPaperScissorsClient project
    - name: Publish RockPaperScissorsClient Project
      run: dotnet publish --configuration Release --no-restore -o ./publish
      working-directory: RockPaperScissors/RockPaperScissorsClient/RockPaperScissorsClient

    # Upload the build artifacts
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4  
      with:
        name: published-artifacts
        path: ./publish

  # Job for compiling the Arduino project (if applicable)
  arduino-build:
    runs-on: ubuntu-latest  # Use the latest version of Ubuntu for CI

    steps:
      # Check out the repository to get the Arduino code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Arduino CLI for compiling Arduino code (if used)
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v1
        with:
          version: '0.19.2'  # Specify the version of Arduino CLI

      # Install the Arduino AVR platform for compiling for AVR (if used)
      - name: Install Arduino AVR platform
        run: arduino-cli core install arduino:avr  # Install the AVR core

      # Compile the Arduino project for Arduino Uno (if applicable)
      - name: Build Arduino Project
        run: arduino-cli compile --fqbn arduino:avr:uno RockPaperScissors/RockPaperScissorsServer/RockPaperScissorsServer.ino
          
      # Upload the Arduino build artifact
      - name: Upload Arduino Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arduino-build  # Name of the Arduino artifact
          path: RockPaperScissors/RockPaperScissorsServer/build/*
